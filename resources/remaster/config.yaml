# OpenXWA shipped default configuration.
# This file is mandatory; the user config.yaml may override documented user
# settings.
input:
  mouse_flight: false
  mouse_mode: 'position'
  mouse_sensitivity: 5
  mouse_invert_y: true
  controller:
    device:
      # Empty GUID selects the first connected controller.
      guid: ''
      path: ''
      ordinal: 0
    roll_enabled: true
    rumble_enabled: true
    rumble_strength: 6
    # Quest Touch controllers appear as one virtual gamepad (src/xwa_vr):
    #   right stick = rightx/righty, left stick = leftx/lefty, where lefty is
    #   a throttle lever that stays where it is left; triggers = trigger axes;
    #   A/B/X/Y = south/east/west/north; right grip = rightshoulder;
    #   stick clicks = leftstick/rightstick; menu button = start.
    #   Holding the LEFT grip turns Y/B/A/X into D-pad up/right/down/left and
    #   the left trigger into leftshoulder and the right grip into misc1.
    #   Stick clicks: right = guide, left grip + right = leftstick,
    #   left = rightstick, left grip + left = back.
    # Every binding below is remappable in Options > Controller.
    gamepad:
      axes:
        yaw: { source: 'rightx', invert: false, deadzone: 0.08 }
        pitch: { source: 'righty', invert: false, deadzone: 0.08 }
        throttle: { source: 'lefty', invert: false, deadzone: 0.0 }
        roll: { source: 'leftx', invert: false, deadzone: 0.15 }
      buttons:
        '1': { axis: 'righttrigger', direction: 'positive', threshold: 0.5 }
        '2': 'rightshoulder'
        '3': 'south'
        '4': 'east'
        '5': 'west'
        '6': 'north'
        '7': { axis: 'lefttrigger', direction: 'positive', threshold: 0.5 }
        '8': 'leftstick'
        '9': 'rightstick'
        '10': 'start'
        '11': 'back'
        '12': 'guide'
        '13': 'leftshoulder'
        '14': 'misc1'
        '15': 'none'
        '16': 'none'
      pov: 'dpad'
      # Button slots 1-16, then D-pad up, right, down, and left.
      # Codes are the action codes from the game's JOYSTICK.TXT.
      actions:
        - 156 # right trigger: fire weapon
        - 155 # right grip: pick target in sight
        - 116 # A: next target
        - 119 # B: cycle weapon settings
        - 101 # X: cycle fighters targeting you
        - 114 # Y: target nearest fighter
        - 32  # left trigger: confirm (leave hangar, hyperspace)
        - 13  # left grip + right stick click: match targeted craft's speed
        - 120 # left stick click: cycle firing settings (link fire)
        - 27  # menu: options screen
        - 111 # left grip + left stick click: nearest objective craft
        - 104 # right stick click: hyperspace (H)
        - 68  # left grip + left trigger: dock with targeted craft (Shift-D)
        - 44  # left grip + right grip: cycle target components
        - 0
        - 0
        - 82  # left grip + Y: release carried object (Shift-R)
        - 204 # left grip + B: shield recharge rate
        - 203 # left grip + A: laser recharge rate
        - 80  # left grip + X: pick up targeted craft (Shift-P)
    joystick:
      axes:
        yaw: { source: 0, invert: false, deadzone: 0.08 }
        pitch: { source: 1, invert: true, deadzone: 0.08 }
        throttle: { source: 2, invert: false, deadzone: 0.08 }
        roll: { source: 3, invert: false, deadzone: 0.08 }
      buttons:
        '1': 0
        '2': 1
        '3': 2
        '4': 3
        '5': 4
        '6': 5
        '7': 6
        '8': 7
        '9': 8
        '10': 9
        '11': 10
        '12': 11
        '13': 12
        '14': 13
        '15': 14
        '16': 15
      pov_hat: 0
      # Button slots 1-16, then hat up, right, down, and left.
      actions:
        - 156
        - 157
        - 114
        - 108
        - 101
        - 105
        - 91
        - 8
        - 13
        - 93
        - 0
        - 0
        - 0
        - 0
        - 0
        - 0
        - 186
        - 184
        - 180
        - 182
models:
  smooth_angle_degrees: 90
  force_opt: true
  opt_emissive_strength: 1.5
  opt_projectile_emissive_strength: 5.0
  engine_emissive_strength: 2.5
effects:
  explosion_genus_emissive_strength: 2.5
  glow_mark_emissive_strength: 5.0
assets:
  prefer_original_2d: false
presentation:
  # 1 renders at the display refresh rate; 2 renders at half refresh.
  vsync_divisor: 1
  # Required shipped baseline; user config.yaml may override both values.
  msaa_samples: 2
  hdr_output: true
texture_filtering:
  anisotropic: true
  max_anisotropy: 8.0
hangar_lighting:
  # Artificial ceiling source for the enclosed hangar. The launch-reference
  # backdrop receives shadows but does not cast into this light.
  enabled: true
  direction_x: 0.0
  direction_y: 0.0
  direction_z: 1.0
  intensity: 0.8
  color_r: 1.0
  color_g: 1.0
  color_b: 1.0
  # Linear ambient cube: +Z ceiling fill, horizontal wall bounce, -Z floor bounce.
  ambient_ceiling: 0.16
  ambient_sides: 0.10
  ambient_floor: 0.06
  shadow_filter_radius: 2.0
skybox:
  enabled: true
  exposure: 1.0
  path: "flight/skyboxes/stars.ktx2"
  # Sky source: "cube" uses the authored cube map at `path`; "stars"
  # (alias "procedural") uses the GPU twinkling starfield reproducing the
  # classic CPU FlightStarfield_Render. The star_* knobs apply to "stars".
  mode: "stars"
  star_brightness: 1.0   # peak star brightness (tuned for the tonemap)
  star_density: 0.4      # grid-cell occupancy; star count ~= 6*grid^2*density
  star_grid: 32          # cells per cube-face edge (angular spacing)
  # Dot geometry in CLASSIC VIEWPORT PIXELS, scaled by the viewport->render
  # upscale at draw time so a star matches the classic single-pixel look at
  # any resolution. 0.5 half-extent = one classic pixel.
  star_core_px: 0.5      # star dot half-extent (classic px); 0.5 = 1 pixel
  star_feather: 0.25     # dot antialias edge (classic px)
  star_flare: 1.0        # bright-star flare brightness (0 = off); exact
                         # DrawBrightStarFlare ±1px plus/L pattern
hyperspace_tunnel:
  # Ship-relative 3D simplex tunnel used by the remaster renderer.
  travel_speed: 13.0      # forward rate; 8 matches the reference shader
  rotation_speed: -2.3   # radians per second around the tunnel axis
  noise_scale: 0.5       # multiplier for all simplex octave frequencies
  brightness: 1.0        # final linear emission before bloom and tonemapping
  highlight_strength: 3.0 # cyan-white noise highlights and cap light; independent of the blue body
  focal_length: 0.9     # tunnel perspective; larger values narrow the apparent opening
  twist: 0.1       # reference angular shear: 1.25 / (2 * pi)
  cap_radius: 0.001       # normalized-screen radius of the full-strength white core
  cap_falloff: 30.0        # exponential falloff outside the core
  mesh_ambient_strength: 0.7  # tunnel radiance contribution to HD cockpit diffuse lighting
  mesh_environment_roughness: 1.0 # 0 = sharp field, 1 = cosine-hemisphere diffuse convolution
  mesh_key_strength: 0.15      # cap-colored HD cockpit directional/specular lighting
  dark_color_r: 0.0      # reference tunnel reaches black between noise structures
  dark_color_g: 0.0
  dark_color_b: 0.0
  body_color_r: 0.0
  body_color_g: 0.0
  body_color_b: 1
  highlight_color_r: 0.05
  highlight_color_g: 0.24
  highlight_color_b: 0.99
  cap_color_r: 0.09       # linear HDR color of the distant additive light
  cap_color_g: 0.28
  cap_color_b: 1.0
point_lights:
  enabled: true
  clustered: true            # automatically uses brute force for small light counts
  cluster_depth_slices: 24
  cluster_debug: false
  scale: 1.0
  range_scale: 1.0
  min_distance: 64.0
  spec_weight: 1.0
  diffuse_wrap: 1.0
  contrib_cap: 1.0
lighting:
  intensity: 0.8
  spec_mul: 1.0
  wrap: 0.0
  spec_geom_adapt: true
  ambient_r: 0.08
  ambient_g: 0.08
  ambient_b: 0.08
bloom:
  intensity: 0.5
temporal_upscaling:
  # off, native_aa, quality, balanced, or performance.
  mode: "off"
  # Positive values enable FSR's RCAS pass.
  sharpness: 0.0
motion_blur:
  quality: 2
  shutter: 0.5
  camera_blur: true
  pause_keep_blur: true
  velocity_viz: false
  # Consume FSR's retained render-resolution motion without a full-size copy.
  fsr_direct_motion: true
